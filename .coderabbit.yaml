# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Keep this configuration aligned with CodeRabbit's current v2 schema.
language: "en-GB"

tone_instructions: >-
  Prioritise confirmed, actionable correctness, reliability and security issues,
  with concrete fixes. Combine related findings, don't repeat earlier comments,
  and skip speculative or purely stylistic feedback.

reviews:
  profile: "chill"
  high_level_summary: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    # The default branch (development) is always reviewed; this adds release PRs.
    base_branches:
      - "main"
  path_filters:
    - "!**/node_modules/**"
    - "!dist/**"
    - "!build/**"
  path_instructions:
    - path: "**/*.md"
      instructions: >-
        Avoid purely stylistic or editorial findings. Still report material
        factual errors, security or privacy risks, and instructions that would
        break setup or normal project workflows.

chat:
  # Prevent CodeRabbit from auto-responding to every commit.
  auto_reply: false
