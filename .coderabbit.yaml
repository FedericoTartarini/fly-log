# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Keep this configuration aligned with CodeRabbit's current v2 schema.
language: "en-GB"

tone_instructions: >-
  Prioritize confirmed, actionable correctness, reliability, and security issues.
  Include concise evidence and concrete fixes; avoid speculative or repetitive
  feedback and purely stylistic suggestions.

reviews:
  profile: "chill"
  high_level_summary: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
  path_filters:
    - "!**/node_modules/**"
    - "!node_modules/**"
    - "!dist/**"
    - "!build/**"
  path_instructions:
    - path: "**/*.md"
      instructions: >-
        Avoid purely stylistic or editorial findings. Still report material
        factual errors, security or privacy risks, and instructions that would
        break setup or normal project workflows.
    - path: "docs/**"
      instructions: >-
        Avoid purely stylistic or editorial findings. Still report material
        factual errors, security or privacy risks, and instructions that would
        break setup or normal project workflows.

chat:
  # Prevent CodeRabbit from auto-responding to every commit.
  auto_reply: false
