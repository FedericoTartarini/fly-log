<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/airplane-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlyLog – free flight log and travel map</title>
    <meta name="description" content="FlyLog is a free personal flight log. Track your flights, see every route on a world map, and explore your travel stats, badges and a globe tour of every trip." />
    <meta name="theme-color" content="#DA111B" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Mantine's colour scheme, applied before the first paint so the
         prerendered page below is light or dark like the app. Mantine's own
         ColorSchemeScript only runs once React does. -->
    <script>
      try {
        var scheme = localStorage.getItem("mantine-color-scheme-value");
        if (scheme !== "light" && scheme !== "dark") {
          scheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-mantine-color-scheme", scheme);
      } catch (e) {}
    </script>
    <!-- The hero heading's font, so the prerendered h1 paints in it from
         the start rather than swapping fonts. Vite gives it the same hashed
         file as the @font-face in the app's CSS. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2" />
    <!-- SEO and Social Meta Tags -->
    <meta name="keywords" content="flights, logbook, travel, aviation, Fly-Log, flight tracking" />
    <meta name="author" content="Federico Tartarini" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph for social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlyLog" />
    <meta property="og:url" content="https://fly-log.netlify.app/" />
    <meta property="og:title" content="FlyLog: every flight you take, logged and mapped" />
    <meta property="og:description" content="A free flight log. See every route on a world map, your distance and travel stats, badges for your milestones, and a globe tour of every trip. Add a whole trip by describing it." />
    <!-- A new file name when the picture changes, because LinkedIn and others
         cache the preview by URL. -->
    <meta property="og:image" content="https://fly-log.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FlyLog on a phone: the Stats map and the Route tour globe" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlyLog: every flight you take, logged and mapped" />
    <meta name="twitter:description" content="A free flight log with your routes on a world map, your travel stats, badges and a globe tour of every trip." />
    <meta name="twitter:image" content="https://fly-log.netlify.app/og-image.png" />

    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="lGm8-WZQCy7wPnVBQC4ncdPY74UJ-laSIfxAb4loAjA" />

    <!-- Google tag (gtag.js). The calls queue in dataLayer straight away, but
         the 180 kB script loads only after the page, so it does not compete
         with the app for bandwidth on a phone. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-DD8CDH64D3');
      addEventListener('load', function () {
        var tag = document.createElement('script');
        tag.async = true;
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-DD8CDH64D3';
        document.head.appendChild(tag);
      });
    </script>

    <!-- Bing Webmaster Tools Verification -->
    <meta name="msvalidate.01" content="4B8AF8A7C60D5C0CDD039EC816B0F8E5" />
  </head>
  <body>
  <body>
    <!--
      The build (scripts/prerender.mjs) renders the landing page into #root,
      so Googlebot's non-rendering pass and a visitor's first paint both get
      the real page, and React adopts it rather than drawing it again.
    -->
    <div id="root"></div>
    <!--
      The SPA fallback serves this file for every route, so empty #root
      anywhere but "/", and on "/" too for returning signed-in visitors
      (AuthContext sets the hint), who are about to be sent to /stats. This
      runs before the first paint, so neither sees the landing page.
    -->
    <script>
      (function () {
        var signedIn = false;
        try {
          signedIn = localStorage.getItem("fly-log:signed-in") === "1";
        } catch (e) {}
        if (location.pathname !== "/" || signedIn) {
          document.getElementById("root").textContent = "";
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
