name: Cleanup AI PR Noise

on:
  pull_request:
    # Run when a PR is opened, updated, or edited so we clean up prior AI noise
    types: [opened, reopened, synchronize, edited]

permissions:
  # Deleting PR comments uses the Issues API
  issues: write
  pull-requests: write

jobs:
  cleanup-comments:
    runs-on: ubuntu-latest
    # Ensure only one cleanup job runs per PR at a time
    concurrency:
      group: cleanup-ai-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Delete stale AI issue comments
        uses: actions/github-script@v7
        with:
          script: |
            // Use pagination so we don't miss comments when there are many.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            // Known bot usernames and helpful body patterns.
            const aiBots = [
              'coderabbitai[bot]',
              'coderabbit[bot]',
              'github-copilot[bot]',
              'coderabbit-ai',
            ];

            const noisyBodyPattern = /automated review|suggested by ai|ai suggestion|coderabbit/i;

            const pr = context.payload.pull_request;
            const currentHeadSha = pr.head.sha;
            const prUpdatedAt = new Date(pr.updated_at).getTime();

            for (const comment of comments) {
              const author = comment.user && comment.user.login;
              const body = comment.body || '';

              if (aiBots.includes(author) || noisyBodyPattern.test(body)) {
                const commentCreatedAt = new Date(comment.created_at).getTime();
                const isOlderThanUpdate =
                  Number.isFinite(prUpdatedAt) && Number.isFinite(commentCreatedAt)
                    ? commentCreatedAt < prUpdatedAt
                    : true;
                const mentionsHead = body.includes(currentHeadSha);
                if (isOlderThanUpdate && !mentionsHead) {
                  try {
                    console.log(`Deleting stale comment ${comment.id} from ${author}`);
                    await github.rest.issues.deleteComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: comment.id,
                    });
                  } catch (error) {
                    console.warn(
                      `Failed to delete issue comment ${comment.id} from ${author}:`, error,
                    );
                  }
                }
              }
            }

      - name: Delete stale AI inline review comments
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const currentHeadSha = pr.head.sha;

            // Pull request review comments are the inline comments on changed files.
            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const aiBots = new Set([
              'coderabbitai[bot]',
              'coderabbit[bot]',
              'github-copilot[bot]',
              'coderabbit-ai',
            ]);
            const noisyBodyPattern = /automated review|suggested by ai|ai suggestion|coderabbit/i;

            for (const comment of reviewComments) {
              const author = comment.user && comment.user.login;
              const body = comment.body || '';
              const isAi = aiBots.has(author) || noisyBodyPattern.test(body);

              if (!isAi) continue;

              // Keep only comments created for the current head commit.
              // If the PR changed, older inline bot comments are stale noise.
              const isStale = comment.commit_id !== currentHeadSha;
              if (!isStale) continue;

              try {
                console.log(`Deleting stale inline comment ${comment.id} from ${author} on ${comment.path}`);
                await github.rest.pulls.deleteReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              } catch (error) {
                console.warn(
                  `Failed to delete review comment ${comment.id} from ${author}:`, error,
                );
              }
            }
