name: Sync main into development

# The maintainer's PRs go straight to main, and contributors' PRs go to
# development. Merging main back keeps development from falling behind, so
# contributors branch from current code. A conflict fails this job, and then
# main has to be merged into development by hand.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-development

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Merge main into development
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          git push origin development
